name: Build game

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android APK, signed with Unity's debug key (fine for sideloading).
          - targetPlatform: Android
            label: Android APK
            artifact: CallOfMiniZombies-APK
          # Windows .exe. Built with the Mono backend so it can run on a
          # Linux runner (IL2CPP for Windows needs a Windows runner).
          - targetPlatform: StandaloneWindows64
            label: Windows EXE
            artifact: CallOfMiniZombies-Windows
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevelAuto
          buildName: CallOfMiniZombies
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.targetPlatform }}
